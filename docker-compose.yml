version: "3.8"

services:
  lin-meimei:
    build: .
    container_name: lin-meimei-agent
    restart: always
    # 不再直接暴露端口，通过 Caddy 反向代理
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - WORKSPACE_DIR=/app/workspace
      - DATA_DIR=/app/data
      - USERS_DB_DIR=/app/data/users
    volumes:
      # 持久化用户数据（SQLite 数据库）
      - user_data:/app/data
      # 持久化 Claude Code OAuth 凭证
      - claude_auth:/root/.claude
      # workspace 可以挂载本地目录方便热更新人设
      # - ./workspace:/app/workspace
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    container_name: lin-meimei-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - lin-meimei

volumes:
  user_data:
    name: linmeimei-user-data
  claude_auth:
    name: linmeimei-claude-auth
  caddy_data:
    name: linmeimei-caddy-data
  caddy_config:
    name: linmeimei-caddy-config
